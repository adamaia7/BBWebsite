name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Submit sitemap URLs to IndexNow
        run: |
          KEY=341551e6be6481bea00e68f34af1a65b
          sleep 30
          URLS=$(curl -fsS https://baubild.ge/sitemap.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -R . | jq -sc .)
          echo "Submitting $(echo "$URLS" | jq length) URLs"
          BODY=$(jq -nc --arg k "$KEY" --argjson u "$URLS" '{host:"baubild.ge",key:$k,keyLocation:("https://baubild.ge/"+$k+".txt"),urlList:$u}')
          CODE=$(curl -s -o resp.txt -w "%{http_code}" -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" -d "$BODY")
          echo "IndexNow HTTP $CODE"; cat resp.txt || true
          [ "$CODE" = 200 ] || [ "$CODE" = 202 ]
